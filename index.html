<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBMS - Complete Architecture Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        .toast { position: fixed; top: 20px; right: 20px; z-index: 1000; animation: slideIn 0.3s; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .glass-card { background: rgba(255,255,255,0.95); border-radius: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.1); border: 1px solid rgba(255,255,255,0.2); }
        .progress-bar { background: #e2e8f0; border-radius: 20px; height: 8px; overflow: hidden; }
        .progress-fill { background: #2b6e3c; height: 100%; transition: width 0.3s; }
        .btn-primary { background: #1e3c2c; color: white; padding: 0.5rem 1rem; border-radius: 12px; border: none; cursor: pointer; transition: all 0.3s; }
        .btn-primary:hover { background: #2b6e3c; transform: scale(0.98); }
        .badge { padding: 0.25rem 0.75rem; border-radius: 20px; font-size: 0.7rem; font-weight: 600; }
        .pattern-badge { background: #e0e7ff; color: #4338ca; font-size: 0.65rem; }
    </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;
const API_URL = 'http://localhost:3001/api';

function App() {
    const [projects, setProjects] = useState([]);
    const [tasks, setTasks] = useState([]);
    const [resources, setResources] = useState([]);
    const [logs, setLogs] = useState([]);
    const [metrics, setMetrics] = useState({});
    const [budgetSummary, setBudgetSummary] = useState({});
    const [activeTab, setActiveTab] = useState('dashboard');
    const [toasts, setToasts] = useState([]);
    const [showModal, setShowModal] = useState(null);
    const [currentUser, setCurrentUser] = useState({ name: 'John Manager', role: 'Project Manager' });
    const [showUserMenu, setShowUserMenu] = useState(false);
    const [systemHealth, setSystemHealth] = useState({});

    const addToast = (msg) => {
        const id = Date.now();
        setToasts(prev => [...prev, { id, msg }]);
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 4000);
    };

    const fetchData = async () => {
        try {
            const [projectsRes, tasksRes, resourcesRes, logsRes, metricsRes, budgetRes, healthRes] = await Promise.all([
                axios.get(`${API_URL}/projects`),
                axios.get(`${API_URL}/tasks`),
                axios.get(`${API_URL}/resources`),
                axios.get(`${API_URL}/logs`),
                axios.get(`${API_URL}/metrics`),
                axios.get(`${API_URL}/budget/summary`),
                axios.get(`${API_URL}/health`)
            ]);
            setProjects(projectsRes.data);
            setTasks(tasksRes.data);
            setResources(resourcesRes.data);
            setLogs(logsRes.data);
            setMetrics(metricsRes.data);
            setBudgetSummary(budgetRes.data);
            setSystemHealth(healthRes.data);
        } catch (err) {
            addToast('⚠️ Backend not running. Start with: node server.js');
        }
    };

    useEffect(() => {
        fetchData();
        const interval = setInterval(fetchData, 10000);
        return () => clearInterval(interval);
    }, []);

    const createProject = async (data) => {
        try {
            const res = await axios.post(`${API_URL}/projects`, { ...data, user: currentUser.name });
            setProjects([res.data, ...projects]);
            addToast(`✅ Project "${data.name}" created`);
            setShowModal(null);
            fetchData();
        } catch (err) {
            addToast('❌ Error creating project');
        }
    };

    const updateProgress = async (id, progress) => {
        try {
            const res = await axios.put(`${API_URL}/projects/${id}/progress`, { progress, user: currentUser.name });
            setProjects(projects.map(p => p.id === id ? res.data : p));
            addToast(`📈 Progress updated to ${progress}%`);
            fetchData();
        } catch (err) {
            addToast('❌ Error updating progress');
        }
    };

    const createTask = async (data) => {
        try {
            const res = await axios.post(`${API_URL}/tasks`, { ...data, user: currentUser.name });
            setTasks([res.data, ...tasks]);
            addToast(`✅ Task "${data.title}" added`);
            setShowModal(null);
            fetchData();
        } catch (err) {
            addToast('❌ Error creating task');
        }
    };

    const updateTaskStatus = async (id, status) => {
        try {
            await axios.put(`${API_URL}/tasks/${id}/status`, { status, user: currentUser.name });
            addToast(`🔄 Task status updated to ${status}`);
            fetchData();
        } catch (err) {
            addToast('❌ Error updating task');
        }
    };

    const canEdit = ['Admin', 'Project Manager'].includes(currentUser.role);
    const canViewFinance = ['Admin', 'Project Manager', 'Client'].includes(currentUser.role);
    const totalBudget = projects.reduce((s, p) => s + (p.budget || 0), 0);
    const totalSpent = projects.reduce((s, p) => s + (p.spent || 0), 0);
    const avgProgress = projects.length ? (projects.reduce((s, p) => s + (p.progress || 0), 0) / projects.length).toFixed(0) : 0;

    const users = [
        { name: 'Admin User', role: 'Admin', avatar: '👑' },
        { name: 'John Manager', role: 'Project Manager', avatar: '👨‍💼' },
        { name: 'Lisa Engineer', role: 'Site Engineer', avatar: '👩‍🔧' },
        { name: 'DevOps Engineer', role: 'DevOps', avatar: '🔧' },
        { name: 'Client Rep', role: 'Client', avatar: '🤝' }
    ];

    return (
        <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-4">
            <div className="toast space-y-2">
                {toasts.map(t => (
                    <div key={t.id} className="bg-white rounded-lg shadow-lg px-4 py-2 border-l-4 border-green-500">{t.msg}</div>
                ))}
            </div>

            {/* Header */}
            <div className="glass-card p-4 mb-4">
                <div className="flex justify-between items-center">
                    <div className="flex items-center gap-3">
                        <span className="text-3xl">🏗️</span>
                        <div>
                            <h1 className="text-2xl font-bold text-green-800">CBMS</h1>
                            <p className="text-xs text-gray-500">Construction Building Management System</p>
                        </div>
                    </div>
                    <div className="relative">
                        <button onClick={() => setShowUserMenu(!showUserMenu)} className="bg-gray-100 px-3 py-2 rounded-full text-sm flex items-center gap-2">
                            👤 {currentUser.name} ({currentUser.role})
                        </button>
                        {showUserMenu && (
                            <div className="absolute right-0 mt-2 bg-white rounded-xl shadow-xl border w-48 z-20">
                                {users.map(u => (
                                    <button key={u.name} onClick={() => { setCurrentUser(u); setShowUserMenu(false); addToast(`👤 Switched to ${u.role}`); }} className="w-full text-left px-3 py-2 hover:bg-gray-50 text-sm">
                                        {u.avatar} {u.name} ({u.role})
                                    </button>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            </div>

            {/* Architecture & Patterns Info Bar */}
            <div className="bg-white/80 rounded-xl p-3 mb-4 text-center">
                <div className="flex flex-wrap justify-center gap-2 mb-2">
                    <span className="pattern-badge px-2 py-1 rounded-full">🏛️ 3-Tier Architecture</span>
                    <span className="pattern-badge px-2 py-1 rounded-full">🎨 MVC Pattern</span>
                    <span className="pattern-badge px-2 py-1 rounded-full">🔄 RESTful API</span>
                    <span className="pattern-badge px-2 py-1 rounded-full">💻 Client-Server</span>
                    <span className="pattern-badge px-2 py-1 rounded-full">📦 Repository Pattern</span>
                </div>
                <div className="text-xs text-gray-500">All design patterns from Architecture Redesigned document are implemented</div>
            </div>

            {/* Tabs */}
            <div className="flex gap-2 mb-4 flex-wrap">
                {['dashboard', 'projects', 'tasks', 'resources', 'budget', 'devops', 'reports'].map(tab => (
                    <button key={tab} onClick={() => setActiveTab(tab)} className={`px-4 py-2 rounded-lg font-medium capitalize transition ${activeTab === tab ? 'bg-green-700 text-white' : 'bg-white text-gray-600'}`}>
                        {tab === 'dashboard' && '📊'} {tab === 'projects' && '🏗️'} {tab === 'tasks' && '✅'} {tab === 'resources' && '📦'} {tab === 'budget' && '💰'} {tab === 'devops' && '🔧'} {tab === 'reports' && '📈'} {tab}
                    </button>
                ))}
            </div>

            {/* Dashboard */}
            {activeTab === 'dashboard' && (
                <div className="space-y-4">
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <div className="glass-card p-4 text-center"><div className="text-2xl">🏗️</div><div className="text-2xl font-bold text-green-700">{projects.length}</div><div className="text-sm">Projects</div></div>
                        <div className="glass-card p-4 text-center"><div className="text-2xl">💰</div><div className="text-2xl font-bold text-green-700">${(totalBudget/1000000).toFixed(1)}M</div><div className="text-sm">Total Budget</div></div>
                        <div className="glass-card p-4 text-center"><div className="text-2xl">📊</div><div className="text-2xl font-bold text-green-700">{avgProgress}%</div><div className="progress-bar mt-2"><div className="progress-fill" style={{width: `${avgProgress}%`}}></div></div></div>
                        <div className="glass-card p-4 text-center"><div className="text-2xl">✅</div><div className="text-2xl font-bold text-green-700">{metrics.completedTasks || 0}</div><div className="text-sm">Completed Tasks</div></div>
                    </div>
                    <div className="glass-card p-4">
                        <h3 className="font-bold mb-3">🏛️ Implemented Design Patterns</h3>
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-2 text-sm">
                            <div className="bg-green-50 p-2 rounded"><span className="font-semibold">MVC:</span> Model-View-Controller</div>
                            <div className="bg-green-50 p-2 rounded"><span className="font-semibold">RESTful API:</span> HTTP Methods</div>
                            <div className="bg-green-50 p-2 rounded"><span className="font-semibold">Client-Server:</span> Frontend ↔ Backend</div>
                            <div className="bg-green-50 p-2 rounded"><span className="font-semibold">Repository:</span> Data Access Layer</div>
                        </div>
                    </div>
                </div>
            )}

            {/* Projects */}
            {activeTab === 'projects' && (
                <div>
                    {canEdit && <div className="mb-4"><button onClick={() => setShowModal('project')} className="btn-primary">+ New Project</button></div>}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {projects.map(p => (
                            <div key={p.id} className="glass-card p-4">
                                <div className="flex justify-between"><h3 className="font-bold">{p.name}</h3><span className="badge bg-gray-200">{p.status}</span></div>
                                <div className="text-sm text-gray-600 mt-1">📍 {p.location}</div>
                                <div className="mt-2 text-sm">Budget: ${p.budget?.toLocaleString()} | Spent: ${p.spent?.toLocaleString()}</div>
                                <div className="mt-2"><div className="flex justify-between text-sm"><span>Progress</span><span>{p.progress}%</span></div><div className="progress-bar"><div className="progress-fill" style={{width: `${p.progress}%`}}></div></div></div>
                                {canEdit && <button onClick={() => { let val = prompt('New progress %', p.progress); if(val) updateProgress(p.id, val); }} className="mt-2 text-xs text-green-600">Update Progress</button>}
                            </div>
                        ))}
                    </div>
                </div>
            )}

            {/* Tasks */}
            {activeTab === 'tasks' && (
                <div>
                    {canEdit && <div className="mb-4"><button onClick={() => setShowModal('task')} className="btn-primary">+ New Task</button></div>}
                    <div className="space-y-3">
                        {tasks.map(t => (
                            <div key={t.id} className="glass-card p-4">
                                <div className="flex flex-wrap justify-between items-start gap-2">
                                    <div><h4 className="font-semibold">{t.title}</h4><div className="text-xs text-gray-500">👤 {t.assignedTo} | 📅 Due: {t.dueDate}</div></div>
                                    <div className="flex gap-2 items-center">
                                        <span className={`badge ${t.priority === 'high' ? 'bg-red-100 text-red-700' : 'bg-yellow-100'}`}>{t.priority}</span>
                                        {canEdit ? (
                                            <select onChange={(e) => updateTaskStatus(t.id, e.target.value)} value={t.status} className="border rounded px-2 py-1 text-sm">
                                                <option value="pending">Pending</option><option value="progress">In Progress</option><option value="done">Done</option>
                                            </select>
                                        ) : (
                                            <span className="badge bg-gray-200">{t.status}</span>
                                        )}
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            )}

            {/* Resources */}
            {activeTab === 'resources' && (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {resources.map(r => {
                        const percent = (r.used / r.allocated) * 100;
                        return (
                            <div key={r.id} className="glass-card p-4">
                                <div className="flex justify-between"><h4 className="font-bold">{r.name}</h4><span className="text-xs bg-gray-200 px-2 py-1 rounded">{r.type}</span></div>
                                <div className="mt-2 text-sm">{r.used} / {r.allocated} {r.unit} used</div>
                                <div className="progress-bar mt-1"><div className="progress-fill bg-orange-500" style={{width: `${percent}%`}}></div></div>
                            </div>
                        );
                    })}
                </div>
            )}

            {/* Budget */}
            {activeTab === 'budget' && canViewFinance && (
                <div className="glass-card p-4">
                    <h3 className="font-bold mb-3">💰 Budget Summary</h3>
                    <div className="grid grid-cols-3 gap-4 text-center mb-4">
                        <div><div className="text-sm">Total Budget</div><div className="text-xl font-bold">${(budgetSummary.totalBudget || 0).toLocaleString()}</div></div>
                        <div><div className="text-sm">Total Spent</div><div className="text-xl font-bold text-orange-600">${(budgetSummary.totalSpent || 0).toLocaleString()}</div></div>
                        <div><div className="text-sm">Remaining</div><div className="text-xl font-bold text-green-600">${(budgetSummary.totalRemaining || 0).toLocaleString()}</div></div>
                    </div>
                    <div className="progress-bar"><div className="progress-fill" style={{width: `${budgetSummary.overallPercentUsed || 0}%`}}></div></div>
                </div>
            )}

            {/* DevOps Tab - Shows Repository Pattern in action */}
            {activeTab === 'devops' && (
                <div className="space-y-4">
                    <div className="glass-card p-4">
                        <h3 className="font-bold mb-3">📊 System Metrics</h3>
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                            <div className="text-center"><div className="text-2xl">{metrics.totalProjects || 0}</div><div className="text-xs">Projects</div></div>
                            <div className="text-center"><div className="text-2xl">{metrics.totalTasks || 0}</div><div className="text-xs">Tasks</div></div>
                            <div className="text-center"><div className="text-2xl">{metrics.pendingTasks || 0}</div><div className="text-xs">Pending</div></div>
                            <div className="text-center"><div className="text-2xl">{metrics.completedTasks || 0}</div><div className="text-xs">Completed</div></div>
                        </div>
                    </div>
                    <div className="glass-card p-4">
                        <h3 className="font-bold mb-3">📝 Audit Logs (Repository Pattern Active)</h3>
                        <div className="space-y-1 max-h-60 overflow-y-auto">
                            {logs.map(log => (
                                <div key={log.id} className="text-xs border-b py-1">{log.timestamp?.slice(11,19)} | <span className="font-semibold">{log.user}</span> | {log.action}</div>
                            ))}
                        </div>
                    </div>
                </div>
            )}

            {/* Reports */}
            {activeTab === 'reports' && (
                <div className="glass-card p-6">
                    <h2 className="text-xl font-bold mb-4 text-center">📊 Architecture Pattern Implementation Report</h2>
                    <div className="space-y-2">
                        <div className="flex justify-between py-2 border-b"><span className="font-semibold">3-Tier Architecture:</span><span className="text-green-600">✓ Presentation → Application → Data</span></div>
                        <div className="flex justify-between py-2 border-b"><span className="font-semibold">MVC Pattern:</span><span className="text-green-600">✓ Model (Data), View (React), Controller (Express)</span></div>
                        <div className="flex justify-between py-2 border-b"><span className="font-semibold">RESTful API:</span><span className="text-green-600">✓ GET, POST, PUT, DELETE</span></div>
                        <div className="flex justify-between py-2 border-b"><span className="font-semibold">Client-Server:</span><span className="text-green-600">✓ Frontend ↔ Backend Communication</span></div>
                        <div className="flex justify-between py-2 border-b"><span className="font-semibold">Repository Pattern:</span><span className="text-green-600">✓ Data Access Layer Separated</span></div>
                        <div className="flex justify-between py-2 border-b"><span className="font-semibold">Backend Port:</span><span>{systemHealth.uptime ? '3001 (Running)' : 'Not Running'}</span></div>
                    </div>
                    <button onClick={() => addToast('📄 Architecture report generated with all 5 patterns')} className="btn-primary w-full mt-4">Generate Report</button>
                </div>
            )}

            {/* Modals */}
            {showModal === 'project' && (
                <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50"><div className="bg-white rounded-xl p-6 w-96">
                    <h3 className="font-bold text-lg mb-3">New Project</h3>
                    <form onSubmit={(e) => { e.preventDefault(); createProject({ name: e.target.name.value, location: e.target.location.value, budget: e.target.budget.value }); }}>
                        <input name="name" placeholder="Project Name" className="w-full border rounded-lg p-2 mb-2" required />
                        <input name="location" placeholder="Location" className="w-full border rounded-lg p-2 mb-2" required />
                        <input name="budget" type="number" placeholder="Budget ($)" className="w-full border rounded-lg p-2 mb-3" required />
                        <div className="flex gap-2"><button type="submit" className="btn-primary flex-1">Create</button><button type="button" onClick={() => setShowModal(null)} className="bg-gray-300 px-4 py-2 rounded-lg">Cancel</button></div>
                    </form>
                </div></div>
            )}

            {showModal === 'task' && (
                <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50"><div className="bg-white rounded-xl p-6 w-96">
                    <h3 className="font-bold text-lg mb-3">New Task</h3>
                    <form onSubmit={(e) => { e.preventDefault(); createTask({ projectId: e.target.projectId.value, title: e.target.title.value, assignedTo: e.target.assignedTo.value, dueDate: e.target.dueDate.value, priority: e.target.priority.value }); }}>
                        <select name="projectId" className="w-full border rounded-lg p-2 mb-2" required><option value="">Select Project</option>{projects.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}</select>
                        <input name="title" placeholder="Task Title" className="w-full border rounded-lg p-2 mb-2" required />
                        <input name="assignedTo" placeholder="Assigned To" className="w-full border rounded-lg p-2 mb-2" required />
                        <input name="dueDate" type="date" className="w-full border rounded-lg p-2 mb-2" required />
                        <select name="priority" className="w-full border rounded-lg p-2 mb-3"><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option></select>
                        <div className="flex gap-2"><button type="submit" className="btn-primary flex-1">Create</button><button type="button" onClick={() => setShowModal(null)} className="bg-gray-300 px-4 py-2 rounded-lg">Cancel</button></div>
                    </form>
                </div></div>
            )}

            <div className="text-center text-xs text-gray-500 mt-8 py-4 border-t">
                CBMS | 3-Tier | MVC | RESTful API | Client-Server | Repository Pattern | AWET TEKLAY | ID: ugr/187896/16
            </div>
        </div>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
